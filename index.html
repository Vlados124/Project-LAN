<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project LAN CRM</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — top bar, left rail of views, work area; lead opens in a right-side panel */
:root{
  --bg:#eef0f4;--surface:#ffffff;--sunk:#f5f6f9;--line:#dde0e8;--line2:#c9cdd8;
  --ink:#161924;--ink2:#4c5264;--ink3:#7c8294;
  --accent:#2f4fd9;--accent-ink:#ffffff;--accent-soft:#e6eafd;
  --hi:#1f8a4c;--hi-soft:#e2f4ea;--mid:#b86a00;--mid-soft:#fbefd9;--lo:#c2353a;--lo-soft:#fbe5e6;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 8px 24px rgba(20,25,40,.08);
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Unbounded","Onest",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141b;--surface:#1b1e28;--sunk:#161922;--line:#2b2f3c;--line2:#3a3f50;
  --ink:#e9ebf2;--ink2:#b0b5c5;--ink3:#7f8598;
  --accent:#7d93ff;--accent-ink:#0f1220;--accent-soft:#232a4a;
  --hi:#55d18a;--hi-soft:#173326;--mid:#f2b04d;--mid-soft:#3a2c14;--lo:#ff7c80;--lo-soft:#3d1c1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141b;--surface:#1b1e28;--sunk:#161922;--line:#2b2f3c;--line2:#3a3f50;
  --ink:#e9ebf2;--ink2:#b0b5c5;--ink3:#7f8598;
  --accent:#7d93ff;--accent-ink:#0f1220;--accent-soft:#232a4a;
  --hi:#55d18a;--hi-soft:#173326;--mid:#f2b04d;--mid-soft:#3a2c14;--lo:#ff7c80;--lo-soft:#3d1c1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:11px}
.logo small{font-family:var(--f-ui);font-weight:500;color:var(--ink3);font-size:12px}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:0 34px 0 12px}
.search kbd{position:absolute;right:8px;top:8px;font:11px var(--f-num);color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.spacer{flex:1}
.scope{flex:none}.scope button{white-space:nowrap}
@media (max-width:820px){.scope button[data-scope="none"]{display:none}}
@media (max-width:560px){.scope{display:none}}
.own{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);white-space:nowrap}
.ava{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 10px var(--f-ui);text-transform:uppercase;flex:none}
.warnbox{background:var(--mid-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.warnbox a{cursor:pointer}
.tpls{display:flex;flex-direction:column;gap:10px}
.tpl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.tpl .b{flex:1;min-width:0}.tpl .b b{display:block}.tpl .b div{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgok{display:flex;gap:8px;align-items:center;color:var(--hi);font-weight:500}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.ok{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 40%,var(--line))}
.btn.no{color:var(--lo);border-color:color-mix(in srgb,var(--lo) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:default}

/* shell */
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100% - 57px)}
.rail{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:57px;align-self:start;height:calc(100vh - 57px)}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500}
.rail button:hover{background:var(--surface)}
.rail button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.rail button:focus-visible{outline:2px solid var(--accent)}
.rail svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail .cnt{margin-left:auto;font:12px var(--f-num);color:var(--ink3)}
.rail .cnt.hot{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.rail .cnt.warn{background:var(--lo);color:#fff;border-radius:99px;padding:0 7px}
.rail hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--ink3);padding:8px 10px}
main{min-width:0;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:821px){main{padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:57px;z-index:15;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);padding:8px max(12px,env(safe-area-inset-left,0px))}
  .rail button{white-space:nowrap;padding:6px 10px}
  .rail hr,.rail .foot{display:none}
  .logo small,.search kbd{display:none}
  .addlbl{display:none}
}
@media (max-width:480px){.logo span{display:none}}

/* page head */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-family:var(--f-disp);font-weight:500;font-size:21px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--ink3);font-size:13px;max-width:62ch}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.score{display:inline-grid;place-items:center;min-width:38px;height:24px;padding:0 6px;border-radius:7px;font:600 13px var(--f-num);font-variant-numeric:tabular-nums}
.score.hi{background:var(--hi-soft);color:var(--hi)}.score.mid{background:var(--mid-soft);color:var(--mid)}.score.lo{background:var(--lo-soft);color:var(--lo)}.score.na{background:var(--sunk);color:var(--ink3);border:1px dashed var(--line2)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:4px 10px;border-radius:7px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent)}
select.f{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 8px;font-size:13px}

/* queue rows */
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;cursor:pointer}
.qrow:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.qrow .big{width:52px;height:52px;border-radius:12px;font-size:18px}
.qrow h3{margin:0;font-size:15px;font-weight:600}
.qrow .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.qrow .why{margin:6px 0 0;color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow .side{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:600px){.qrow{grid-template-columns:auto minmax(0,1fr)}.qrow .side{grid-column:1/-1;justify-content:flex-start}}

/* kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 268px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 190px);scroll-snap-align:start}
.col.drop{border-color:var(--accent);background:var(--accent-soft)}
.colh{padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
.colh .n{font:12px var(--f-num);color:var(--ink3)}
.colh .sum{margin-left:auto;font:12px var(--f-num);color:var(--ink3)}
.colb{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.kc:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.kc.dragging{opacity:.4}
.kc .t{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.kc b{font-weight:600;font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.kc .ns{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.kc .ns.late{color:var(--lo);font-weight:500}
.kc .ft{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink3)}
.kc .ft .money{margin-left:auto;font-family:var(--f-num);color:var(--ink2)}
.empty-col{font-size:12px;color:var(--ink3);text-align:center;padding:14px 6px;border:1px dashed var(--line2);border-radius:8px}

/* table */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk);position:sticky;top:0}
th[data-sort]{cursor:pointer}th[data-sort]:hover{color:var(--ink)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .co{font-weight:600}
td .sub{color:var(--ink3);font-size:12px;max-width:34ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tasks */
.grp{margin-bottom:20px}
.grp h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:0 0 8px;display:flex;gap:8px;align-items:center}
.grp h2 .num{color:var(--ink2)}
.grp.late h2{color:var(--lo)}
.trow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.trow:hover{border-color:var(--line2)}
.trow .d{font:13px var(--f-num);color:var(--ink2)}
.trow .s{min-width:0}.trow .s b{font-weight:600}.trow .s div{color:var(--ink2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.trow{grid-template-columns:minmax(0,1fr) auto}.trow .d{grid-column:1/-1}}

/* metrics */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:12px;color:var(--ink3)}
.kpi .v{font-family:var(--f-disp);font-weight:500;font-size:24px;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;min-width:0}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.two>.panel{margin-bottom:0}
.fun{display:flex;flex-direction:column;gap:7px}
.fr{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.fr .bar{height:22px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fr .bar i{display:block;height:100%;background:var(--accent);border-radius:6px;min-width:2px}
.fr .v{text-align:right;font-family:var(--f-num);font-size:12.5px;color:var(--ink2)}
.fr .v small{color:var(--ink3)}
@media (max-width:480px){.fr{grid-template-columns:90px minmax(0,1fr) 70px}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:41;box-shadow:-10px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh .ttl{flex:1;min-width:0}
.dh input.name{width:100%;border:1px solid transparent;background:transparent;font-family:var(--f-disp);font-weight:500;font-size:18px;letter-spacing:-.02em;padding:2px 6px;margin-left:-6px;border-radius:6px}
.dh input.name:hover,.dh input.name:focus{border-color:var(--line);background:var(--sunk)}
.dh .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.db{flex:1;overflow-y:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:18px}
.stepper{display:flex;gap:4px;flex-wrap:wrap}
.stepper button{all:unset;cursor:pointer;font-size:12px;padding:5px 9px;border-radius:7px;border:1px solid var(--line);color:var(--ink2);background:var(--surface)}
.stepper button.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.stepper button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.stepper button.bad.cur{background:var(--lo);border-color:var(--lo);color:#fff}
.stepper button:focus-visible{outline:2px solid var(--accent)}
.sec h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:8px}
.sec h4 .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.ai{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ai .head{display:flex;gap:12px;align-items:center;padding:12px;background:var(--sunk)}
.ai .head .big{width:56px;height:56px;border-radius:12px;font-size:20px}
.ai .head b{display:block;font-weight:600}
.ai .head span{font-size:12px;color:var(--ink3)}
.ai .body{padding:10px 14px 14px;display:grid;gap:10px}
.ai .k{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:2px}
.ai ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink2)}
.ai ul li+li{margin-top:2px}
.ai .ev li{color:var(--hi)}.ai .as li{color:var(--mid)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--ink3);font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.fld textarea{resize:vertical;min-height:80px;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.src{background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:13px;color:var(--ink2);white-space:pre-wrap;max-height:180px;overflow:auto;overflow-wrap:anywhere}
.link{font-size:13px;overflow-wrap:anywhere}
.log{font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.log div{display:flex;gap:10px}.log .num{color:var(--ink3);font-size:12px;flex:none}
.err{color:var(--lo);font-size:13px}
.hint{font-size:12px;color:var(--ink3)}
.msgs{display:flex;flex-direction:column;gap:6px}.msg summary{cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}.msg .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.btn{text-decoration:none;color:inherit}
.ico{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chs{display:inline-flex;gap:3px;color:var(--accent);align-items:center}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.tbtns .btn{gap:6px}
.rseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rseg button{all:unset;cursor:pointer;text-align:center;padding:8px 6px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink2);background:var(--surface)}
.rseg button:hover{border-color:var(--line2)}
.rseg button:focus-visible{outline:2px solid var(--accent)}
.rseg button.on{color:#fff;border-color:transparent}
.rseg button.on[data-v="noanswer"]{background:var(--ink3)}.rseg button.on[data-v="refused"]{background:var(--lo)}.rseg button.on[data-v="interest"]{background:var(--mid)}.rseg button.on[data-v="agreed"]{background:var(--hi)}
@media (max-width:420px){.rseg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tlist{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.tlist div{display:flex;gap:8px;align-items:center;min-width:0}
.tlist .num{color:var(--ink3);font-size:12px;flex:none}
.tlist .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink3)}
.sub2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
td .sub2{flex-wrap:nowrap;white-space:nowrap;margin:0}
td.nw{white-space:nowrap}
.cpy{display:flex;gap:6px}.cpy input{flex:1;min-width:0}.cpy .btn{height:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* быстрые кнопки связи и навигация по лидам */
.qbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.reach{display:inline-flex;gap:4px;align-items:center;color:var(--ink3)}

.nav{display:flex;gap:2px;align-items:center;flex:none}
.nav .num{font-size:12px;color:var(--ink3);min-width:54px;text-align:center}
.nav .btn{width:30px;padding:0;justify-content:center}
.peers{display:flex;flex-direction:column;gap:4px}
.peers a{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;text-decoration:none;color:var(--ink);font-size:13px}
.peers a:hover{border-color:var(--line2);background:var(--sunk)}
.peers a span{color:var(--ink3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peers a .chip{margin-left:auto;flex:none}
@media (max-width:520px){.dh{flex-wrap:wrap}.dh .nav{order:-1;width:100%;justify-content:flex-end;margin-bottom:-8px}}
.rb{display:inline-flex;gap:4px;flex-wrap:nowrap}
.rb a,.rb span{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;text-decoration:none;border:1px solid transparent}
.rb .em{background:var(--accent-soft);color:var(--accent)}
.rb .ph{background:var(--hi-soft);color:var(--hi)}
.rb .tg{background:color-mix(in srgb,#2a9fd6 14%,var(--surface));color:#2a9fd6}
.rb .no{color:var(--ink3);border-color:var(--line);border-style:dashed}
.kbdh{font:11px var(--f-num);color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,12,20,.45);padding:16px}
.mbox{width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px}
.mbox h2{margin:0;font-family:var(--f-disp);font-weight:500;font-size:18px;letter-spacing:-.02em}
.mbox .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.dz{border:1.5px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--ink3);font-size:13px}
.dz.on{border-color:var(--accent);background:var(--accent-soft)}
.prev{font-size:12px}
.prev td,.prev th{padding:5px 8px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}

/* empty / toast */
.empty{background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{margin:0;font-family:var(--f-disp);font-weight:500;font-size:17px}
.empty p{margin:0;color:var(--ink3);max-width:46ch}
.tbtn{all:unset;cursor:pointer;margin-left:10px;font-weight:600;color:var(--accent-soft);text-decoration:underline}
.tbtn:focus-visible{outline:2px solid var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner{background:var(--lo-soft);color:var(--lo);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
body.auth .shell,body.auth .top .btn{display:none}
.login{min-height:calc(100vh - 57px);display:grid;place-items:center;padding:24px 16px}
.login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.login h2{margin:0;font-family:var(--f-disp);font-weight:500;font-size:20px}

  .trow .row{flex-wrap:wrap!important}

  .dh{padding:10px 14px}
  .db{padding:14px 14px calc(40px + env(safe-area-inset-bottom,0px));gap:16px}
  .fld input,.fld select,.fld textarea,.sec input,.sec select,.sec textarea{font-size:16px}
  .fld input,.fld select{min-height:42px}
  .btn{height:40px}
  .btn.sm,.qbar .btn{height:38px;font-size:14px;padding:0 12px}
  .qbar{gap:8px}
  .qbar .btn{flex:1 1 auto;justify-content:center}
  .tbtns .btn{flex:1 1 calc(50% - 6px);justify-content:center}
  .stepper{gap:6px}.stepper button{font-size:13.5px;padding:8px 11px}
  .rseg button{padding:11px 6px;font-size:14px}
  .nav .btn{width:40px}
  .tlist div{flex-wrap:wrap}
  .mbox{padding:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
}
.stabs,.mob{display:none}
@media (max-width:640px){

}

<script>
const SRC=["БД Колизеум","Заявка с сайта","Telegram","Сайт/новости","RSS/поиск","ВКонтакте","Google Таблица","Вручную"];

const ST={new:"Новый",scored:"На проверке",sent:"Написали",replied:"Ответили",called:"Прозвонили",won:"Выиграно",lost:"Отказ",rejected:"Отклонён"};

const BOARD=["sent","replied","called","won","lost"];

const SCOL={new:"var(--ink3)",scored:"var(--mid)",sent:"var(--accent)",replied:"var(--hi)",called:"var(--hi)",won:"var(--hi)",lost:"var(--lo)",rejected:"var(--lo)"};
const ICON={
 queue:'<path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/>',
 board:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>',
 all:'<path d="M3 5h18M3 12h18M3 19h18"/>',
 tasks:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 metrics:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'};

let sb=null,db=null,sample=null,dl=true,myId=null,canWrite=true,leads=[],cfg={desc:""},loaded=false;
let view=lsGet("view")||"queue",q="",openId=null,busy={},banner="",pend={main:false,drawer:false};
let TEAM=[],scope=lsGet("scope")||"all",tgState=null,dupForce=false,tplEdit=null;
let qF={src:"",seg:"",reach:"",role:""};
let F={st:"",src:"",seg:"",tz:"",resp:"",ct:"",own:"",reach:"",role:""},sort={k:"createdAt",d:-1},qSeg="toreview",batch=null,dragId=null,imp=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hash=s=>{let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return"l"+(h>>>0).toString(36)};
const norm=u=>u.trim().toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/[?#].*$/,"").replace(/\/$/,"");
const L=id=>leads.find(l=>l.id===id);
const rub=n=>(+n||0).toLocaleString("ru-RU")+" ₽";
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fdate=s=>{if(!s)return"";const [y,m,d]=s.split("-");return`${d}.${m}.${y.slice(2)}`};
const ftime=t=>t?new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
function lsGet(k){try{return localStorage.getItem("lancrm_"+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem("lancrm_"+k,v)}catch(e){}}
let toastAct=null;
function toast(t,act){const el=$("#toast");toastAct=act||null;el.innerHTML=esc(t)+(act?` <button class="tbtn" data-act="toastact">${esc(act.label)}</button>`:"");el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true;toastAct=null},act?7000:2600)}
async function dbPatch(id,o){const l=L(id);if(l)Object.assign(l,o);const {error}=await sb.rpc("patch_lead",{p_id:id,p_patch:o});if(error)throw error;saveCache()}
async function dbSet(id,d){const {error}=await sb.from("leads").upsert({id,data:d});if(error)throw error;const i=leads.findIndex(l=>l.id===id);if(i<0)leads.push({id,...d});else leads[i]={id,...d};saveCache()}

function scoreCls(l){const s=l.ai?.score;return s==null?"na":s>=70?"hi":s>=40?"mid":"lo"}

const ICO={tg:'<path d="M21.5 4.5 2.8 11.7c-.9.4-.9 1.1 0 1.3l4.6 1.4 1.8 5.4c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.2-2.2 4.7 3.5c.8.5 1.4.2 1.6-.8l3-14.3c.3-1.2-.4-1.7-1-1.3z"/><path d="m7.4 14.4 10.4-6.6"/>',wa:'<path d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3.2 3.2z"/><path d="M9 9.5c.3 2 2.5 4.2 4.5 4.5l1.2-1.2 1.8.8c-.2 1.2-1 1.9-2.2 1.9-3.3 0-6.3-3-6.3-6.3 0-1.2.7-2 1.9-2.2l.8 1.8z"/>',up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',email:'<path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/>',messenger:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'};
const CH={email:"Почта",messenger:"Мессенджер",call:"Звонок"};

const RCOL={noanswer:"var(--ink3)",refused:"var(--lo)",interest:"var(--mid)",agreed:"var(--hi)"};
const LOSS=["Не актуально","Нет бюджета","Дорого","Уже есть подрядчик","Не та аудитория / нет сотрудников","Не дозвонились","Другое"];
const ico=(k,sz=14)=>`<svg class="ico" width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg>`;
function touchesOf(l){return[...(l.touches||[]),...(l.messages||[]).map(m=>({t:m.t,by:m.by,ch:m.ch==="email"?"email":"messenger",note:m.ch==="email"?"Письмо из CRM: "+(m.subject||""):"Сообщение в Telegram",auto:1}))].sort((a,b)=>a.t-b.t)}
function lastTouch(l){const a=touchesOf(l);return a[a.length-1]}

function respChip(l){return l.resp?`<span class="chip resp" style="color:${RCOL[l.resp]}"><span class="dot"></span><span style="color:var(--ink2)">${RESP[l.resp]}${l.resp==="refused"&&l.lossReason?" · "+esc(l.lossReason):""}</span></span>`:""}
const initials=e=>{const n=String(e||"").split("@")[0].replace(/[^a-zа-яё0-9]/gi," ").trim().split(/\s+/);return((n[0]||"?")[0]+(n[1]?n[1][0]:(n[0]||"")[1]||"")).toUpperCase()};
function ownEl(l,full){return l.owner?`<span class="own" title="Ответственный: ${esc(l.owner)}"><span class="ava">${esc(initials(l.owner))}</span>${full?esc(who(l.owner)):""}</span>`:(full?'<span class="own" style="color:var(--ink3)">не назначен</span>':"")}
function stChip(s){return`<span class="chip" style="color:${SCOL[s]}"><span class="dot"></span><span style="color:var(--ink2)">${ST[s]||s}</span></span>`}

async function loadTeam(){try{const {data}=await sb.from("members").select("email");TEAM=(data||[]).map(r=>r.email).sort()}catch(e){}
  const seen=new Set(TEAM.map(e=>e.toLowerCase()));leads.forEach(l=>[l.owner,l.createdBy].forEach(e=>{if(e&&!seen.has(e.toLowerCase())){seen.add(e.toLowerCase());TEAM.push(e)}}));

let cacheT=null;
function saveCache(){clearTimeout(cacheT);cacheT=setTimeout(()=>{try{if(myId&&loaded)localStorage.setItem("lan_cache_"+myId,JSON.stringify({t:Date.now(),cfg,leads:leads.map(({_confirmDel,...l})=>l)}))}catch(e){/* не влезло в память браузера — убираем старую копию, чтобы не показывать устаревшую базу */try{localStorage.removeItem("lan_cache_"+myId)}catch(_){}}},800)}
function clearCache(){try{Object.keys(localStorage).filter(k=>k.startsWith("lan_cache_")).forEach(k=>localStorage.removeItem(k))}catch(e){}}
function showLogin(){db=null;leads=[];loaded=false;document.body.classList.add("auth");$("#login").hidden=false;$("#drawerWrap").hidden=true;setTimeout(()=>$("#l_em")?.focus(),0)}
async function start(ses){
  if(db)return;db=sb;myId=ses.user.email;
  document.body.classList.remove("auth");$("#login").hidden=true;render();aiLoad();
  const onRow=p=>{if(p.eventType==="DELETE"||p.new?.data?.archived){leads=leads.filter(l=>l.id!==(p.old?.id||p.new?.id))}else{const r=p.new,i=leads.findIndex(l=>l.id===r.id),v={id:r.id,...r.data};if(i<0)leads.push(v);else{const keep=leads[i]._confirmDel;leads[i]=v;if(keep)v._confirmDel=keep}}softRender();saveCache()};
  sb.channel("lan").on("postgres_changes",{event:"*",schema:"public",table:"leads"},onRow)
    .on("postgres_changes",{event:"*",schema:"public",table:"config"},p=>{if(p.new?.id==="lan"){cfg=p.new.data||{desc:""};if(view==="settings")softRender()}}).subscribe();
  // Копия базы в этом браузере: лиды видны сразу, пока идёт обновление
  const CK="lan_cache_"+myId;let cached=false;
  try{const c=JSON.parse(localStorage.getItem(CK)||"null");if(c?.leads?.length){leads=c.leads.filter(l=>!l.archived);if(c.cfg)cfg=c.cfg;loaded=true;cached=true;banner="";render()}}catch(e){}
  // Загрузка маленькими порциями: крупные ответы от зарубежных серверов у части провайдеров зависают
  // Порции подбираются сами: начинаем со 100, при зависании/ошибке уменьшаем до 8
  let all=[],from=0,done=false,STEP=100;
  const slow=setTimeout(()=>{if(!done){banner=cached?"Обновляю базу — сеть отвечает медленно. Показана копия от последнего входа.":"Сеть отвечает медленно, загружаю лидов по частям… Если долго — включите VPN.";softRender()}},6000);
  for(let tries=0;;){
    const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),15000);
    let data=null,error=null;
    try{({data,error}=await sb.from("leads").select("id,data").order("id").range(from,from+STEP-1).abortSignal(ac.signal))}catch(e){error=e}
    clearTimeout(tm);
    if(error){if(STEP>8){STEP=Math.max(8,STEP>>2);continue}if(++tries<4){await new Promise(r=>setTimeout(r,1500*tries));continue}banner="Не удалось загрузить базу: "+(error.message||"нет связи")+". Обновите страницу или включите VPN.";break}
    tries=0;all=all.concat(data);
    if(!cached){leads=all.filter(r=>!r.data?.archived).map(r=>({id:r.id,...r.data}));loaded=true;softRender()}
    else if(all.length>=200){banner=`Обновляю базу: загружено ${all.length}…`;renderMain()}
    if(data.length<STEP){done=true;break}from+=STEP}
  clearTimeout(slow);
  if(done){const fresh=all.filter(r=>!r.data?.archived).map(r=>({id:r.id,...r.data})),map=new Map(leads.map(l=>[l.id,l]));
    leads=fresh.map(l=>{const o=map.get(l.id);if(o?._confirmDel)l._confirmDel=1;return l});loaded=true;banner=""}
  loadTeam();
  try{const c=await sb.from("config").select("data").eq("id","lan").maybeSingle();if(!c.error)cfg=c.data?.data||{desc:""}}catch(e){}
  render();saveCache();
}

/* Сохранение прокрутки при перерисовке, чтобы страница не «прыгала» */
const SCROLLERS=".db,.tw,.board,.colb,.src,.mlist,.tlist";
function keepScroll(root,fn){
  const els=[...root.querySelectorAll(SCROLLERS)].map((e,i)=>[e.className,i,e.scrollTop,e.scrollLeft]);
  const wy=window.scrollY,wx=window.scrollX;
  fn();
  const now=[...root.querySelectorAll(SCROLLERS)];
  for(const [cls,i,t,l] of els){const e=now[i];if(e&&e.className===cls){e.scrollTop=t;e.scrollLeft=l}}
  if(window.scrollY!==wy||window.scrollX!==wx)window.scrollTo(wx,wy);
}

  pend.main=false;
  const V={queue:vQueue,board:vBoard,all:vAll,tasks:vTasks,metrics:vMetrics,settings:vSettings}[view]||vQueue;

}

   ${batch?`<div class="progress" style="margin:-8px 0 14px"><i style="width:${Math.round(batch.done/batch.total*100)}%"></i></div>`:""}
   ${scopeNote(l=>l.status==="new"||l.status==="scored")}<div class="filters"><div class="seg">${[["toreview","Все",all.length],["hot","Горячие ≥70",all.filter(l=>l.ai?.score>=70).length],["none","Без оценки",all.filter(l=>!l.ai).length]].map(([k,t,n])=>`<button data-qseg="${k}" class="${qSeg===k?"on":""}">${t} <span class="num">${n}</span></button>`).join("")}</div>${qfil}</div>`;

    &&(!F.own||(F.own==="none"?!l.owner:l.owner===F.own))&&(!F.resp||(F.resp==="none"?!l.resp:l.resp===F.resp))&&(!F.ct||(F.ct==="no"?!touchesOf(l).length:F.ct==="any"?touchesOf(l).length:touchesOf(l).some(x=>x.ch===F.ct)))&&reachOk(l,F.reach)&&(!F.role||roleOf(l)===F.role));
  const key={company:l=>(l.company||"").toLowerCase(),score:l=>l.ai?.score??-1,status:l=>FLOW.indexOf(l.status),nextDate:l=>l.nextDate||"9999",touch:l=>lastTouch(l)?.t||0,owner:l=>(l.owner||"~").toLowerCase(),resp:l=>["agreed","interest","noanswer","refused"].indexOf(l.resp)>>>0,amount:l=>+l.amount||0,createdAt:l=>l.createdAt||0,reach:l=>{const r=reach(l);return(r.em?4:0)+(r.ph?2:0)+(r.tg?1:0)}}[sort.k];
  list.sort((a,b)=>{const x=key(a),y=key(b);return(x<y?-1:x>y?1:0)*sort.d});
  navList=list.map(l=>l.id);
  const opt=(arr,v,lbl)=>`<option value="">${lbl}</option>`+arr.map(([k,t])=>`<option value="${esc(k)}" ${v===k?"selected":""}>${esc(t)}</option>`).join("");
  const srcs=[...new Set(leads.map(l=>l.source).filter(Boolean))],segs=[...new Set(leads.map(l=>l.segment).filter(Boolean))];

  ${scopeNote(()=>true)}<div class="filters"><select class="f" id="frole" data-filter="role">${(()=>{const n={};for(const l of leads)if(inScope(l)){const r=roleOf(l);n[r]=(n[r]||0)+1}return opt(ROLES.filter(([k])=>n[k]||F.role===k).map(([k,t])=>[k,t+" · "+(n[k]||0)]),F.role,"Должность: любая")})()}</select><select class="f" id="fst" data-filter="st">${opt(Object.entries(ST),F.st,"Все статусы")}</select><select class="f" id="fsrc" data-filter="src">${opt(srcs.map(s=>[s,s]),F.src,"Все источники")}</select><select class="f" id="fseg" data-filter="seg">${opt(segs.map(s=>[s,s]),F.seg,"Все сегменты")}</select><select class="f" id="ftz" data-filter="tz">${opt([["0","МСК"],["-1","МСК−1"],["1","МСК+1"],["2","МСК+2"],["3","МСК+3"],["4","МСК+4"],["5","МСК+5"],["6","МСК+6"],["7","МСК+7"],["8","МСК+8"],["9","МСК+9"],["none","Без региона"]],F.tz,"Часовой пояс: любой")}</select><select class="f" id="fct" data-filter="ct">${opt([["no","Ещё не связывались"],["any","Связывались"],["email","Связывались по почте"],["messenger","В мессенджере"],["call","Звонили"]],F.ct,"Связь: любая")}</select><select class="f" id="fown" data-filter="own">${opt([["none","Без ответственного"],...TEAM.map(e=>[e,e===myId?e+" (вы)":e])],F.own,"Ответственный: все")}</select><select class="f" id="fresp" data-filter="resp">${opt([["none","Без ответа (не отмечен)"],...Object.entries(RESP)],F.resp,"Ответ: любой")}</select><button class="btn sm ${F.reach==="noph"?"pri":""}" data-act="noph" title="Показать лидов без номера телефона">${ico("call",13)} Нет номера <span class="num">${leads.filter(l=>match(l)&&!reach(l).ph).length}</span></button><select class="f" id="freach" data-filter="reach">${opt(REACH,F.reach,"Контакты: любые")}</select>${F.st||F.src||F.seg||F.ct||F.resp||F.own||F.reach?'<button class="btn sm ghost" data-act="clearf">Сбросить</button>':""}</div>
  <div class="tw"><table class="lt"><thead><tr>${th("company","Компания")}${th("reach","Контакты")}${th("score","AI")}${th("status","Статус")}${th("touch","Связь")}${th("resp","Ответ")}${th("owner","Ответств.")}<th>Источник</th><th>Следующий шаг</th>${th("nextDate","Дата")}${th("amount","Сумма","r")}${th("createdAt","Добавлен","r")}</tr></thead><tbody>
  ${list.map(l=>`<tr data-open="${l.id}"><td><div class="co">${esc(l.company||"—")}</div><div class="sub">${esc(l.name||(l.contact||"").split(" · ")[0]||l.segment||"")}${l.region?` · 📍 ${esc(l.city||l.region)}${(utcOf(l.region)??3)!==3?" ("+tzStr(l.region).split(" (")[1]:""}`:""}</div></td><td>${reachBadges(l)}</td><td>${scoreEl(l)}</td><td>${stChip(l.status)}</td><td>${touchesOf(l).length?`<div class="sub2">${chIcons(l)}<span class="num" style="color:var(--ink3);font-size:12px">${ftime(lastTouch(l).t)}</span></div>`:'<span style="color:var(--ink3)">—</span>'}</td><td>${respChip(l)||'<span style="color:var(--ink3)">—</span>'}</td><td>${ownEl(l,true)}</td><td class="nw">${esc(l.source||"")}</td><td><div class="sub" style="color:var(--ink2)">${esc(l.nextStep||"")}</div></td><td class="num">${fdate(l.nextDate)}</td><td class="r num">${l.amount?rub(l.amount):""}</td><td class="r num" style="color:var(--ink3)">${l.createdAt?new Date(l.createdAt).toLocaleDateString("ru-RU"):""}</td></tr>`).join("")||'<tr><td colspan="12" style="text-align:center;color:var(--ink3);padding:24px">Ничего не найдено</td></tr>'}
  </tbody></table></div>`;
}

/* Дела */
function vTasks(){
  if(!leads.length)return emptyAll();
  const t=today(),wk=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  const act=leads.filter(l=>ACTIVE.includes(l.status)&&match(l));
  const g=[["late","Просрочено",act.filter(l=>l.nextDate&&l.nextDate<t)],["","Сегодня",act.filter(l=>l.nextDate===t)],["","Ближайшие 7 дней",act.filter(l=>l.nextDate>t&&l.nextDate<=wk)],["","Позже",act.filter(l=>l.nextDate>wk)],["","Без даты следующего шага",act.filter(l=>!l.nextDate)]];
  const row=l=>`<div class="trow" data-open="${l.id}"><span class="d">${l.nextDate?fdate(l.nextDate):"—"}</span><div class="s"><b>${esc(l.company||"Без названия")}</b><div>${esc(l.nextStep||"Шаг не записан")}</div></div><div class="row" style="gap:8px;flex-wrap:nowrap">${ownEl(l)}${stChip(l.status)}</div></div>`;

/* Метрики */
function vMetrics(){
  if(!leads.length)return'<div class="ph"><div><h1>Метрики</h1></div></div><div class="empty"><h3>Данных пока нет</h3><p>Метрики считаются только по реальным лидам. Тестовых цифр здесь нет.</p></div>';
  const has=k=>leads.filter(l=>l[k]).length;
  const stages=[["Найдено",leads.length],["Релевантные ≥60",leads.filter(l=>l.ai?.score>=60).length],["Написали",has("sentAt")],["Ответили",has("repliedAt")],["Прозвонили",has("calledAt")],["Выиграно",leads.filter(l=>l.status==="won").length]];
  const max=stages[0][1]||1;
  const sum=k=>leads.reduce((s,l)=>s+(+l[k]||0),0);
  const sent=has("sentAt"),rep=has("repliedAt");
  const by=f=>{const o={};leads.forEach(l=>{const k=f(l)||"—";(o[k]=o[k]||[]).push(l)});return Object.entries(o).sort((a,b)=>b[1].length-a[1].length)};
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
  const tbl=(t,f)=>`<div class="panel"><h3>${t}</h3><div class="tw" style="border:0"><table><thead><tr><th></th><th class="r">Найдено</th><th class="r">Ср. оценка</th><th class="r">Отпр.</th><th class="r">Ответы</th><th class="r">Прозвонили</th></tr></thead><tbody>${by(f).map(([k,a])=>{const sc=a.filter(l=>l.ai);return`<tr style="cursor:default"><td>${esc(k)}</td><td class="r num">${a.length}</td><td class="r num">${sc.length?Math.round(sc.reduce((s,l)=>s+l.ai.score,0)/sc.length):"—"}</td><td class="r num">${a.filter(l=>l.sentAt).length}</td><td class="r num">${a.filter(l=>l.repliedAt).length} <span style="color:var(--ink3)">${pct(a.filter(l=>l.repliedAt).length,a.filter(l=>l.sentAt).length)}</span></td><td class="r num">${a.filter(l=>l.calledAt).length}</td></tr>`}).join("")}</tbody></table></div></div>`;
  return`<div class="ph"><div><h1>Метрики</h1><p>Всё считается по реальным данным базы. На малых выборках проценты нестабильны — смотрите на абсолютные числа.</p></div></div>
  <div class="kpis">
   <div class="kpi"><div class="l">Лидов в базе</div><div class="v">${leads.length}</div><div class="s">${counts().queue} ждут проверки</div></div>
   <div class="kpi"><div class="l">В работе</div><div class="v">${leads.filter(l=>ACTIVE.includes(l.status)).length}</div><div class="s">${counts().tasks} дел на сегодня и просрочено</div></div>
   <div class="kpi"><div class="l">Ответили на письмо</div><div class="v">${pct(rep,sent)}</div><div class="s">${rep} из ${sent} отправленных</div></div>
   <div class="kpi"><div class="l">Сумма сделок</div><div class="v">${rub(sum("amount"))}</div><div class="s">введено вручную</div></div>
   <div class="kpi"><div class="l">Вознаграждение</div><div class="v">${rub(sum("commOk"))}</div><div class="s">подтверждено · ожидается ${rub(sum("commExp"))}</div></div>
  </div>
  <div class="panel"><h3>Воронка</h3><div class="fun">${stages.map(([t,n],i)=>`<div class="fr"><span>${t}</span><div class="bar"><i style="width:${n/max*100}%;opacity:${1-i*.08}"></i></div><span class="v">${n} <small>${i?pct(n,stages[i-1][1]):""}</small></span></div>`).join("")}</div><p class="hint" style="margin:10px 0 0">Процент — переход с предыдущего этапа. Порог «релевантности» 60 баллов — рабочая договорённость, не факт.</p></div>
  ${respPanel()}
  <div class="two">${tbl("По источникам",l=>l.source)}${tbl("По сегментам",l=>l.segment)}</div>
  <div style="height:14px"></div>${tbl("По типам сигналов",l=>l.ai?.signal)}`;
}

function respPanel(){
  const touched=leads.filter(l=>touchesOf(l).length);
  const rows=Object.entries(RESP).map(([k,t])=>[t,leads.filter(l=>l.resp===k).length,RCOL[k]]);
  const tot=rows.reduce((a,r)=>a+r[1],0)||1;
  const chRows=["email","messenger","call"].map(k=>{const ls=leads.filter(l=>touchesOf(l).some(x=>x.ch===k));return[k,touchesOf({touches:leads.flatMap(l=>l.touches||[]),messages:leads.flatMap(l=>l.messages||[])}).filter(x=>x.ch===k).length,ls.length,ls.filter(l=>l.resp==="interest"||l.resp==="agreed").length,ls.filter(l=>l.resp==="agreed").length]});
  const reasons={};leads.filter(l=>l.resp==="refused").forEach(l=>{const r=l.lossReason||"Причина не указана";reasons[r]=(reasons[r]||0)+1});
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
  return`<div class="two" style="margin-bottom:14px">
   <div class="panel"><h3>Ответы лидов</h3><p class="hint" style="margin:-6px 0 12px">Связались с ${touched.length} из ${leads.length} · ответ отмечен у ${leads.filter(l=>l.resp).length}</p>
    <div class="fun">${rows.map(([t,n,c])=>`<div class="fr"><span>${t}</span><div class="bar"><i style="width:${n/tot*100}%;background:${c}"></i></div><span class="v">${n} <small>${pct(n,tot===1&&!n?0:tot)}</small></span></div>`).join("")}</div>
    ${Object.keys(reasons).length?`<div class="k" style="margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--ink2)">Причины отказов</div><div class="tlist">${Object.entries(reasons).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`<div><span>${esc(r)}</span><span class="num" style="margin-left:auto">${n}</span></div>`).join("")}</div>`:""}</div>
   <div class="panel"><h3>Каналы связи</h3><div class="tw" style="border:0"><table><thead><tr><th></th><th class="r">Касаний</th><th class="r">Лидов</th><th class="r">Интерес+</th><th class="r">Согласие</th></tr></thead><tbody>
    ${chRows.map(([k,n,ls,int,ag])=>`<tr style="cursor:default"><td><span class="sub2" style="margin:0">${ico(k)} ${CH[k]}</span></td><td class="r num">${n}</td><td class="r num">${ls}</td><td class="r num">${int} <span style="color:var(--ink3)">${pct(int,ls)}</span></td><td class="r num">${ag}</td></tr>`).join("")}
    </tbody></table></div><p class="hint" style="margin:10px 0 0">«Интерес+» — ответ «Интерес» или «Согласие» среди лидов, с которыми связывались этим каналом.</p></div></div>`;
}

// Проверяем бота прямо из браузера: у пользователя Telegram открывается, а у сервера иногда нет
async function tgCheckInBrowser(token){if(!/^\d+:[\w-]{20,}$/.test(token))return null;
  const api=async(m,body)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);try{const r=await fetch(`https://api.telegram.org/bot${token}/${m}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{}),signal:c.signal});return await r.json()}finally{clearTimeout(t)}};
  try{const me=await api("getMe");if(!me.ok)throw new Error(me.error_code===401?"Telegram ответил, что такого токена нет — возьмите действующий в @BotFather → /mybots → API Token.":"Telegram не принял токен: "+(me.description||""));
    const up=await api("getUpdates",{limit:100,allowed_updates:["message","my_chat_member","channel_post"]});
    const chats=(up.result||[]).map(u=>u.my_chat_member?.chat||u.message?.chat||u.channel_post?.chat).filter(Boolean);
    const chat=chats.reverse().find(c=>c.type!=="private")||chats[0];
    return{bot:me.result.username,chat:chat?{id:String(chat.id),title:chat.title||[chat.first_name,chat.last_name].filter(Boolean).join(" ")}:null}}
  catch(e){if(e.name==="AbortError"||e instanceof TypeError)return null;throw e}}

function followPending(l){const pr=l.promise&&!l.promise.done&&!touchesOf(l).some(t=>t.ch==="email"&&t.t>l.promise.t);const ma=(l.mailAwait||0)>0&&!touchesOf(l).some(t=>t.ch==="email"&&t.t>l.mailAwait);return{pr:!!pr,aw:(l.tgAwait||0)>0,ma}}
function callBox(l){if(!callDue(l))return"";const late=l.nextDate<today();

async function score(id,quiet){

    const cur=L(id)||l;
    const o={ai,status:cur.status==="new"?"scored":cur.status,err:""};
    if(!cur.draftEdited)o.draft=r.draft||"";
    if(!cur.company&&r.company)o.company=r.company;

    if(e?.code==="rate_limited"||e?.code==="not_granted"){delete busy[id];softRender();throw e}
    await upd(id,{err:"Не удалось оценить: "+(e.message||e.code||"повторите")}).catch(()=>{});
  }

}
async function runBatch(){

  if(!ids.length)return;

function parseCSV(t){
  t=t.replace(/^﻿/,"");
  const first=t.split(/\r?\n/)[0]||"";
  const d=[["\t",(first.match(/\t/g)||[]).length],[";",(first.match(/;/g)||[]).length],[",",(first.match(/,/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f="",inq=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(inq){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else inq=false}else f+=c}
    else if(c=='"')inq=true;else if(c===d){row.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}

async function doImport(){
  const recs=imp?.recs||[];if(!recs.length)return;
  const b=$("#m_go");b.disabled=true;
  let n=0;const now=Date.now();
  for(const o of recs){
    const st=mapStatus(o.status);
    const doc={url:o.url||"",text:o.text||"",company:o.company||"",contact:o.contact||"",name:o.name||"",phone:o.phone||"",email:o.email||"",source:SRC.includes(o.source)?o.source:(o.source||"Google Таблица"),segment:SEG.find(s=>s.toLowerCase()===(o.segment||"").toLowerCase())||(o.segment||"Не определён"),
      createdBy:myId||"",status:st,replyNote:o.replyNote||"",nextStep:o.nextStep||"",nextDate:mapDate(o.nextDate),createdAt:now+n,log:[{t:now,s:st}]};
    const a=parseFloat(String(o.amount||"").replace(/[^\d.,]/g,"").replace(",","."));if(a)doc.amount=a;
    if(STAMP[st]){const order=["sent","replied","called","won"];order.slice(0,order.indexOf(st)+1).forEach(k=>doc[STAMP[k]]=now)}
    try{await dbSet(o._id,doc);n++;b.textContent=`Загружаю ${n}/${recs.length}…`}catch(e){toast("Ошибка записи: "+(e.message||e.code));break}
  }

}
async function doExport(){
  if(!dl)return;

  const cell=v=>{v=String(v??"");return/[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[cols.map(c=>c[1]).join(";")].concat(leads.map(l=>cols.map(([k])=>cell(k==="status"?ST[l.status]:k==="resp"?(RESP[l.resp]||""):k==="touchN"?touchesOf(l).length:k==="touchCh"?[...new Set(touchesOf(l).map(x=>CH[x.ch]))].join(", "):k==="touchLast"?(lastTouch(l)?new Date(lastTouch(l).t).toLocaleString("ru-RU"):""):k==="score"?l.ai?.score:k==="signal"?l.ai?.signal:l[k])).join(";")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download=`project-lan-leads-${today()}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("Файл скачан")
}
